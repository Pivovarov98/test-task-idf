# Connection details are supplied by PostgresTestConfiguration through @ServiceConnection.
# Fail instead of connecting to a developer database if the container configuration is missing.
spring.datasource.url=jdbc:postgresql://127.0.0.1:1/test_configuration_missing
spring.datasource.username=test
spring.datasource.password=test
spring.datasource.hikari.connection-timeout=1000
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.main.banner-mode=off
exchange-rates.enabled=false
exchange-rates.app-id=
