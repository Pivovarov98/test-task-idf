services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: test_task_idf
      POSTGRES_USER: test_task_idf
      POSTGRES_PASSWORD: test_task_idf
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_task_idf -d test_task_idf"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
